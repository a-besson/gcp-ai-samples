name: ci-geap-agent-simple

on:
  push:
    paths:
      - "samples/geap-agent-simple/**"
      - ".github/workflows/_sample.yml"
      - ".github/workflows/ci-geap-agent-simple.yml"
      - ".tflint.hcl"
      - ".pre-commit-config.yaml"
      - "Taskfile.yml"
  pull_request:
    paths:
      - "samples/geap-agent-simple/**"
      - ".github/workflows/_sample.yml"
      - ".github/workflows/ci-geap-agent-simple.yml"
      - ".tflint.hcl"
      - ".pre-commit-config.yaml"
      - "Taskfile.yml"

permissions:
  contents: read

jobs:
  sample:
    uses: ./.github/workflows/_sample.yml
    with:
      sample: geap-agent-simple
