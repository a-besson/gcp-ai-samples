[project]
name = "geap-agent-simple"
version = "0.1.0"
description = "Simple ADK agent deployed on Gemini Enterprise Agent Platform Agent Runtime"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]  # T20: no print(); S: security

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are fine in tests
"scripts/*" = ["T201"]  # CLI helpers print their result

[tool.pyright]
include = ["app", "scripts", "tests"]
extraPaths = ["app"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
markers = ["e2e: tests hitting a deployed agent (excluded from CI)"]
