# Root orchestration — foundation (base) first on apply, last on destroy.
version: "3"

dotenv: [".env"]

vars:
  KICS_IMAGE: docker.io/checkmarx/kics:v2.1.20

includes:
  base:
    taskfile: samples/base/Taskfile.yml
    dir: samples/base
    optional: true
  simple:
    taskfile: samples/geap-agent-simple/Taskfile.yml
    dir: samples/geap-agent-simple
    optional: true
  secured:
    taskfile: samples/geap-agent-secured/Taskfile.yml
    dir: samples/geap-agent-secured
    optional: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install workstation dependencies (Brewfile), git hooks, TFLint plugins and check the local configuration
    cmds:
      - brew bundle --file=Brewfile
      - test -f .env || cp .env.example .env
      - pre-commit install
      - tflint --init --config=.tflint.hcl
      - task: doctor

  doctor:
    desc: Check that required tools, Python 3.14 and the gcloud session are available
    cmds:
      - |
        missing=0
        for t in terraform tflint terraform-docs pre-commit gitleaks trivy podman uv ruff gcloud gh python3.14; do
          command -v "$t" >/dev/null || { echo "MISSING: $t (run: task setup)"; missing=1; }
        done
        test -n "${GCP_PROJECT_ID:-}" || { echo "MISSING: GCP_PROJECT_ID in .env"; missing=1; }
        gcloud auth application-default print-access-token >/dev/null 2>&1 \
          || echo "WARNING: no ADC credentials (run: gcloud auth application-default login)"
        exit $missing
    silent: true

  bootstrap:
    desc: Create the encrypted-at-rest, versioned Terraform state bucket in europe-west1 (idempotent)
    preconditions:
      - sh: test -n "$GCP_PROJECT_ID" && test -n "$TF_STATE_BUCKET"
        msg: "Set GCP_PROJECT_ID and TF_STATE_BUCKET in .env (see .env.example)"
    cmds:
      - |
        gcloud storage buckets describe "gs://$TF_STATE_BUCKET" --project="$GCP_PROJECT_ID" >/dev/null 2>&1 \
        || gcloud storage buckets create "gs://$TF_STATE_BUCKET" --project="$GCP_PROJECT_ID" \
             --location="${GCP_REGION:-europe-west1}" --uniform-bucket-level-access --public-access-prevention
      - gcloud storage buckets update "gs://$TF_STATE_BUCKET" --project="$GCP_PROJECT_ID" --versioning

  lint:
    desc: Run all pre-commit hooks on every file
    cmds:
      - pre-commit run --all-files

  kics:
    desc: Scan the IaC with KICS (fails on HIGH/CRITICAL)
    cmds:
      - podman machine start >/dev/null 2>&1 || true
      - podman run --rm -v "$PWD:/path:ro" {{.KICS_IMAGE}} scan -p /path --config /path/kics.config --no-progress

  trivy:
    desc: Scan IaC misconfigurations, vulnerabilities and secrets with Trivy (fails on HIGH/CRITICAL)
    cmds:
      - trivy config --config trivy.yaml .
      - trivy fs --config trivy.yaml --scanners vuln,secret .

  scan:
    desc: Run KICS and Trivy
    cmds:
      - task: kics
      - task: trivy

  test-all:
    desc: Run the offline tests of every sample
    cmds:
      - task: base:test
      - task: simple:test
      - task: secured:test

  apply-all:
    desc: "WARNING: provisions billable resources - base first, then the agents"
    cmds:
      - task: base:apply
      - task: simple:apply
      - task: secured:apply

  destroy-all:
    desc: "WARNING: deletes all sample resources - agents first, base last"
    prompt: This destroys every sample. Continue?
    cmds:
      - task: secured:destroy
      - task: simple:destroy
      - task: base:destroy
